name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsgo --noEmit
      - run: bunx tsc --noEmit
      - run: bunx vitest run
      - run: bunx vitest run src/pattern/Scan.test.ts
      - run: bunx vitest run packages/harness-kit/src/Catalog.test.ts

  # GitHub Packages (npm.pkg.github.com) publish on version tags.
  # Requires a SCOPED package name: @lambdasolver2/opencode-effect-harness
  # Auth: GITHUB_TOKEN with packages:write — no secret needed.
  # Docs: https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-npm-registry
  publish-gpr:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@lambdasolver2'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Publish to GitHub Packages
        run: |
          node <<'JS'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          delete p.workspaces;
          delete p.catalog;
          delete p.overrides;
          fs.writeFileSync('package.json', JSON.stringify(p,null,2));
          JS
          npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
