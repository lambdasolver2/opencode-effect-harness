name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsgo --noEmit
      - run: bunx tsc --noEmit
      - run: bunx vitest run
      - run: bunx vitest run src/pattern/Scan.test.ts
      - run: bunx vitest run packages/harness-kit/src/Catalog.test.ts

  # npmjs publish on version tags — requires NPM_TOKEN secret
  # GitHub-only install works without any token (opencode2 plugin add github:...)
  publish-npmjs:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: |
          node -e "const f=require('fs');const p=JSON.parse(f.readFileSync('package.json','utf8'));delete p.private;f.writeFileSync('package.json',JSON.stringify(p,null,2))"
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # GitHub Packages (npm.pkg.github.com) publish on version tags.
  # Requires a SCOPED package name: @lambdasolver2/opencode-effect-harness
  # Auth: GITHUB_TOKEN with packages:write — no secret needed.
  # Docs: https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-npm-registry
  publish-gpr:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@lambdasolver2'
      - name: Publish to GitHub Packages
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            delete p.private;
            p.name = '@lambdasolver2/opencode-effect-harness';
            p.publishConfig = { registry: 'https://npm.pkg.github.com' };
            p.repository = { type: 'git', url: 'https://github.com/lambdasolver2/opencode-effect-harness.git' };
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          "
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
